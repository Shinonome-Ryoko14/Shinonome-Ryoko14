name: Refresh profile metrics

on:
  schedule:
    # Every day at 02:23 UTC. GitHub may delay schedules during busy periods.
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "assets/generated/metrics-light.svg"
      - "assets/generated/metrics-dark.svg"
      - "assets/generated/metrics.json"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the local metrics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_metrics.py

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/generated/metrics-light.svg assets/generated/metrics-dark.svg assets/generated/metrics.json; then
            echo "Metrics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/metrics-light.svg assets/generated/metrics-dark.svg assets/generated/metrics.json
          git commit -m "chore: refresh GitHub metrics"
          git push
