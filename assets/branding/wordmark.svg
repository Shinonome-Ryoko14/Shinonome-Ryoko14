<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ryoko">
<title>Ryoko</title>
<defs>

    <linearGradient id="wm_ink" x1="160" y1="80" x2="1040" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E5F82"/><stop offset="46%" stop-color="#3F93C4"/><stop offset="76%" stop-color="#8FBFE2"/><stop offset="100%" stop-color="#F2A6C6"/>
    </linearGradient>
    <linearGradient id="wm_sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wm_clip"><text x="600" y="216" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="4" fill="#FFFFFF">Ryoko</text></clipPath>
    <radialGradient id="wm_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FC4E8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#7FC4E8" stop-opacity="0"/>
    </radialGradient>

</defs>
<style>

    @media (prefers-reduced-motion: no-preference) {
      @keyframes wmBreathe {
        0%, 100% { opacity: .38; }
        50% { opacity: .85; }
      }
      @keyframes wmSweep {
        0% { transform: translateX(-620px) skewX(-16deg); }
        55%, 100% { transform: translateX(700px) skewX(-16deg); }
      }
      @keyframes wmLine {
        0% { transform: scaleX(.2); opacity: .2; }
        100% { transform: scaleX(1); opacity: .65; }
      }
      @keyframes wmTwinkle {
        0%, 100% { opacity: .35; transform: scale(.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .wm-glow { animation: wmBreathe 5.6s ease-in-out infinite; }
      .wm-sweep { animation: wmSweep 8.5s ease-in-out infinite; }
      .wm-line { transform-box: fill-box; transform-origin: center; animation: wmLine 1.4s cubic-bezier(.16,1,.3,1) .2s both; }
      .wm-star { transform-box: fill-box; transform-origin: center; animation: wmTwinkle 3.8s ease-in-out infinite; }
      .wm-star.s2 { animation-duration: 4.6s; animation-delay: -1.2s; }
      .wm-star.s3 { animation-duration: 4.2s; animation-delay: -2.4s; }
    }

</style>

  <ellipse cx="600" cy="150" rx="430" ry="130" fill="url(#wm_halo)"/>
  <text class="wm-glow" x="600" y="216" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="4" fill="none" stroke="#7FC4E8" stroke-width="42" opacity=".14">Ryoko</text>
  <text class="wm-glow" x="600" y="216" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="4" fill="none" stroke="#7FC4E8" stroke-width="24" opacity=".20">Ryoko</text>
  <text class="wm-glow" x="600" y="216" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="4" fill="none" stroke="#F2A6C6" stroke-width="11" opacity=".18">Ryoko</text>
  <text x="600" y="216" text-anchor="middle" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="4" fill="url(#wm_ink)" filter="none">Ryoko</text>
  <g clip-path="url(#wm_clip)">
    <rect class="wm-sweep" x="0" y="40" width="170" height="220" fill="url(#wm_sweep)" opacity=".9" transform="translate(-620 0) skewX(-16)"/>
  </g>
  <rect class="wm-line" x="528" y="292" width="144" height="3" rx="1.5" fill="url(#wm_ink)"/>
  <rect x="500" y="292.5" width="200" height="2" rx="1" fill="url(#wm_ink)" opacity=".22"/>
  <g class="wm-star"><path d="M238 84 L242 96 L254 100 L242 104 L238 116 L234 104 L222 100 L234 96 Z" fill="#F2A6C6"/></g>
  <g class="wm-star s2"><path d="M948 96 L951 105 L960 108 L951 111 L948 120 L945 111 L936 108 L945 105 Z" fill="#7FC4E8"/></g>
  <g class="wm-star s3"><circle cx="968" cy="264" r="4.5" fill="#C8B6FF"/></g>

</svg>
