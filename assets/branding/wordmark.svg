<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ryoko">
  <title>Ryoko</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E5F82"/>
      <stop offset=".55" stop-color="#3388BB"/>
      <stop offset="1" stop-color="#7FC4E8"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="600" y="216" text-anchor="middle" fill="url(#ink)" filter="url(#halo)"
        font-family="Noto Serif, Georgia, Times New Roman, serif" font-size="220"
        font-weight="700" letter-spacing="4">Ryoko</text>
  <rect x="540" y="300" width="120" height="2" rx="1" fill="#3388BB" opacity=".55"/>
</svg>
