<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ryoko — System Geek</title>
  <desc id="desc">A dark terminal-inspired banner with neon green typography and system status details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050806"/>
      <stop offset="1" stop-color="#0b130d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7cff6b" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="22" y="22" width="1156" height="316" rx="12" fill="none" stroke="#7cff6b" stroke-opacity=".42"/>
  <path d="M22 62 H1178" stroke="#7cff6b" stroke-opacity=".35"/>
  <circle cx="48" cy="42" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="42" r="5" fill="#ffbd2e"/>
  <circle cx="88" cy="42" r="5" fill="#27c93f"/>
  <text x="112" y="47" fill="#8ea895" font-family="monospace" font-size="13">ryoko@machine: ~</text>
  <text x="64" y="125" fill="#7cff6b" font-family="monospace" font-size="17">$ whoami</text>
  <text x="64" y="190" fill="#e8f5e9" font-family="monospace" font-size="54" font-weight="700" letter-spacing="2">RYOKO<span fill="#7cff6b" filter="url(#glow)">_</span></text>
  <text x="66" y="226" fill="#7cff6b" font-family="monospace" font-size="19" letter-spacing="2">SYSTEMS · ALGORITHMS · RESEARCH</text>
  <text x="66" y="272" fill="#a9b8ac" font-family="monospace" font-size="15">Lightweight by design. Understand the layers beneath.</text>
  <text x="66" y="305" fill="#526b58" font-family="monospace" font-size="12">[ MODULARITY: ON ]  [ OVERENGINEERING: OFF ]</text>
  <g transform="translate(925 118)" fill="none" stroke="#7cff6b" stroke-opacity=".75" stroke-width="1.5">
    <rect width="172" height="148" rx="8"/>
    <path d="M24 30 H148 M24 50 H122 M24 70 H139 M24 90 H105 M24 110 H132"/>
    <circle cx="144" cy="126" r="4" fill="#7cff6b" stroke="none"/>
  </g>
  <text x="944" y="103" fill="#8ea895" font-family="monospace" font-size="11">SYSTEM PROFILE</text>
  <text x="944" y="291" fill="#7cff6b" font-family="monospace" font-size="11">STATUS: EXPLORING</text>
</svg>
